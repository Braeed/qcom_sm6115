name: Build Android Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04            # pin: 24.04 often breaks 4.19 kernels
    timeout-minutes: 120             # default is 360 -> prevents hangs
    defaults:
      run:
        shell: bash                  # implies -eo pipefail
    env:
      OUT_DIR: ${{ github.workspace }}/out
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain
      KBUILD_BUILD_USER: Braaed
      KBUILD_BUILD_HOST: github-actions
      KBUILD_BUILD_VERSION: ${{ github.run_number }}

    steps:
    - name: Checkout source
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        show-progress: false

    - name: Install dependencies
      run: |
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex \
          libelf-dev libssl-dev \
          cpio xz-utils zstd lz4 rsync \
          git curl ca-certificates \
          python3 python-is-python3 \
          unzip

    - name: Setup Neutron Toolchain
      run: |
        mkdir -p "$TOOLCHAIN_DIR"
        cd "$TOOLCHAIN_DIR"

        curl -fsSLo antman \
          https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
        chmod +x antman

        ./antman -S --noprogress
        ./antman --patch=glibc

    - name: Show clang version
      run: |
        $TOOLCHAIN_DIR/bin/clang --version

    # ---------- KernelSU ----------
    - name: Setup KernelSU
      run: |
        curl -LSsf --retry 3 --retry-delay 2 \
          -o /tmp/ksu-setup.sh \
          https://raw.githubusercontent.com/Braeed/KernelSUXX/master/kernel/setup.sh
        bash /tmp/ksu-setup.sh master

    # ---------- Config fragment (merged at build time, defconfig untouched) ----------
    - name: Prepare config fragment
      run: |
        cat > "$RUNNER_TEMP/ci.fragment" <<'EOF'
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
        CONFIG_KSU_DISABLE_32BIT_HOOKS=y
        CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
        CONFIG_KSU_NOPRINTK=y
        CONFIG_BOARD_CITRUS=y
        EOF
        # strip the leading indentation added for YAML readability
        sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/ci.fragment"
        cat "$RUNNER_TEMP/ci.fragment"

    # ---------- Build ----------
    - name: Build Kernel
      run: |
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"
        export KBUILD_BUILD_TIMESTAMP
        KBUILD_BUILD_TIMESTAMP="$(date -u -d "@$(git log -1 --format=%ct)")"
        mkdir -p "$OUT_DIR"

        # Tool variables are passed explicitly (instead of exported env) because
        # LLVM=1 may not be fully supported by every 4.19 tree.
        MAKE=(
          make -j"$(nproc)" O="$OUT_DIR" ARCH=arm64
          LLVM=1 LLVM_IAS=1
          CC=clang
          LD="ld.lld -S"              # -S strips debug info at link time
          AR=llvm-ar NM=llvm-nm
          OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          CLANG_TRIPLE=aarch64-linux-gnu-
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        )

        "${MAKE[@]}" vendor/bengal-perf_defconfig
        scripts/kconfig/merge_config.sh -m -O "$OUT_DIR" \
          "$OUT_DIR/.config" "$RUNNER_TEMP/ci.fragment"
        "${MAKE[@]}" olddefconfig

        # Fail early if Kconfig silently dropped any requested option
        missing=0
        while IFS= read -r line; do
          [[ "$line" == CONFIG_* ]] || continue
          if ! grep -qxF -- "$line" "$OUT_DIR/.config"; then
            echo "::error::Dropped from final .config: $line"
            missing=1
          fi
        done < "$RUNNER_TEMP/ci.fragment"
        [[ $missing -eq 0 ]] || exit 1

        "${MAKE[@]}" 2>&1 | tee "$OUT_DIR/build.log"

    # ---------- Package ----------
    - name: Prepare AnyKernel3 package
      id: prep
      run: |
        BOOT="$OUT_DIR/arch/arm64/boot"
        echo "zipname=4.19-valeryn-ksu.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

        git clone --depth 1 https://github.com/Braeed/AnyKernel3.git

        if [[ ! -f "$BOOT/dtb" ]]; then
          echo "boot/dtb not found, using bengal.dtb..."
          cp "$BOOT/dts/vendor/qcom/bengal.dtb" "$BOOT/dtb"
        fi

        for f in Image dtb dtbo.img; do
          if [[ ! -f "$BOOT/$f" ]]; then
            echo "::error::Missing build output: $BOOT/$f"
            echo "===== Boot Directory ====="
            find "$BOOT" -maxdepth 3 -type f | sort
            exit 1
          fi
          cp "$BOOT/$f" AnyKernel3/
        done

        rm -rf AnyKernel3/.git AnyKernel3/README.md
        find AnyKernel3 -name "*placeholder*" -delete

        {
          echo "### Build info"
          echo '```'
          sha256sum "$BOOT/Image"
          "$TOOLCHAIN_DIR/bin/clang" --version | head -n1
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # The artifact download itself is the flashable zip, so no nested zip is created.
    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.prep.outputs.zipname }}
        path: AnyKernel3/*
        compression-level: 6
        retention-days: 14
        if-no-files-found: error

    - name: Upload debug logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-debug-${{ github.run_number }}
        path: |
          out/build.log
          out/.config
        retention-days: 7
        if-no-files-found: ignore